spring:
  application:
    name: ims-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ims}
    username: ${DB_USER:ims}
    password: ${DB_PASSWORD:ims_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

ims:
  signup:
    enabled: ${IMS_SIGNUP_ENABLED:false}
  outbox:
    poll-interval-ms: 2000
  idempotency:
    enabled: true
    ttl: 24h
    max-key-length: 255
    require-for-api-tokens: false   # flip to true in rollout phase 3
    require-for-sessions: false     # flip to true in rollout phase 4
    cleanup-cron: "0 15 * * * *"
  security:
    jwt-secret: ${IMS_JWT_SECRET:ims-dev-tenant-jwt-secret-key-must-be-at-least-32-bytes-long-2026}
    proxy-secret: ${IMS_PROXY_SECRET:ims-dev-bff-proxy-secret-2026}
    access-token-minutes: 10
  storage:
    endpoint: ${IMS_S3_ENDPOINT:http://localhost:3900}
    region: ${IMS_S3_REGION:us-east-1}
    bucket: ${IMS_S3_BUCKET:ims-dev-files}
    access-key: ${IMS_S3_ACCESS_KEY:GKdevAccessKey0000000000}
    secret-key: ${IMS_S3_SECRET_KEY:devSecretKey00000000000000000000000000000000}
