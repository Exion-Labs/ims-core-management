services:
  postgres:
    image: postgres:17-alpine
    container_name: ims-postgres
    environment:
      POSTGRES_DB: ims
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: ims_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ims_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims -d ims"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ims-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  ims_pg_data:
